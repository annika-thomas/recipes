# Publishes the app to GitHub Pages on every push.
#
# This uploads the whole repository, not just public/, and that is deliberate.
# While Pages is set to "Deploy from a branch", GitHub ALSO runs its own build
# on every push, and the two race — they have finished within the same second.
# If the two produce different layouts the site flips between them and any
# saved URL works only half the time. Publishing the same tree either way makes
# the race harmless: index.html at the root sends you to public/, where the app
# is, whichever build got there last.
#
# Setting Settings -> Pages -> Source to GitHub Actions ends the race properly.

name: Deploy to GitHub Pages

on:
  push:
    branches: [claude/recipe-sharing-app-0snh6g, main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish rather than cancelling it midway.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # The import tests don't need the app's dependencies, and a broken
      # extractor shouldn't reach the phone in your hand.
      - name: Run the tests
        run: npm test

      # Nothing is rewritten before upload, on purpose. Anything this job
      # changed would exist only in the workflow's copy of the site, and the
      # branch build would publish the file without it — which is the very
      # divergence this is trying to get rid of. (.nojekyll is committed at the
      # repo root, so the branch build doesn't run Jekyll either.)

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          # The whole repo, so this matches what the branch build publishes.
          path: .

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
