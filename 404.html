<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Kitchen</title>
  <style>
    body {
      margin: 0; min-height: 100vh; display: grid; place-items: center;
      background: #f6f2ea; color: #3a332c; text-align: center; padding: 24px;
      font: 500 16px/1.5 -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, system-ui, sans-serif;
    }
    a { color: #c85f3c; font-weight: 700; }
    @media (prefers-color-scheme: dark) { body { background: #211d1a; color: #f0e9df; } a { color: #e2825f; } }
  </style>
</head>
<body>
  <div>
    <div style="font-size:44px">🍲</div>
    <p id="msg">Taking you back to Kitchen…</p>
    <p><a id="home" href="/">Tap here if it doesn't</a></p>
  </div>
  <script>
    /*
      A saved link can point at a path that only exists in one of the two ways
      this site gets published. Rather than dead-ending on a 404, send people
      back to the project root, which works in both.
    */
    var base = '/' + (location.pathname.split('/').filter(Boolean)[0] || '') + '/';
    document.getElementById('home').href = base;

    /*
      Never bounce twice in a row: if the root is itself missing, showing this
      page is better than an endless loop between it and the root.

      The guard is a timestamp rather than a flag so it only suppresses an
      *immediate* re-bounce. A flag would stay set for the whole session, and
      a second, unrelated 404 half an hour later would dead-end here for no
      reason.
    */
    var last = 0;
    try { last = Number(sessionStorage.getItem('kitchen.bounced')) || 0; } catch (e) {}
    var looping = Date.now() - last < 5000;

    if (location.pathname !== base && !looping) {
      try { sessionStorage.setItem('kitchen.bounced', String(Date.now())); } catch (e) {}
      location.replace(base);
    } else {
      document.getElementById('msg').textContent = "That page isn't here.";
    }
  </script>
</body>
</html>
