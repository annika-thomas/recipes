#:schema node_modules/wrangler/config-schema.json
name = "kitchen"
main = "worker/index.js"
compatibility_date = "2025-09-01"
compatibility_flags = ["nodejs_compat"]

# The app itself — everything under public/ is served straight from the edge.
# run_worker_first keeps /api/* on the Worker; the SPA falls back to index.html.
[assets]
directory = "./public"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*", "/img/*"]

# Shared recipe database. `npm run deploy:setup` fills in database_id for you.
[[d1_databases]]
binding = "DB"
database_name = "kitchen"
database_id = "PASTE_YOUR_DATABASE_ID_HERE"
# (the placeholder is fine for local dev, which uses its own SQLite file)

# Recipe photos and imported screenshots.
[[r2_buckets]]
binding = "PHOTOS"
bucket_name = "kitchen-photos"

# Secrets — set with `npx wrangler secret put NAME`, never in this file:
#   HOUSEHOLD_PASSCODE   the passcode you both type to get in
#   SESSION_SECRET       random string used to sign the login cookie
